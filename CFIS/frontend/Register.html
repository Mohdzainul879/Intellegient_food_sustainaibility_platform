<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Food Sustainability Platform</title>
  <link rel="stylesheet" href="Register.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="brand">
        <div class="logo">🍴</div>
        <h1>Create Account</h1>
        <p>Join the smart hostel meal system</p>
      </div>

      <form id="registerForm">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label>Hostel / Room</label>
        <input type="text" id="room" placeholder="e.g. Hostel A - 203" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Create password" required>

        <button type="submit">Register</button>
        <p id="message" class="message"></p>
      </form>

      <p class="switch">Already have an account?
        <a href="Login.html">Login</a>
      </p>
    </div>
  </div>
  <script src="Register.js"></script>
</body>
</html>
